<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RUXXSTORE - Tokopedia Modern</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash" class="splash">
        <div class="splash-content">
            <div class="splash-logo">RUXXSTORE</div>
            <div class="splash-loader">
                <div class="loader-bar"></div>
            </div>
            <div class="splash-text">Loading...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" style="display: none;">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">RUXXSTORE</div>
                <div class="nav-menu">
                    <a href="dashboard.html" class="nav-link">Home</a>
                    <a href="search.html" class="nav-link">Search</a>
                    <a href="cart.html" class="nav-link">Cart</a>
                    <a href="account.html" class="nav-link">Account</a>
                </div>
                <div class="nav-user" id="userDisplay"></div>
            </div>
        </nav>

        <div class="hero">
            <div class="hero-content">
                <h1>RUXXSTORE</h1>
                <p>Belanja Mudah, Aman, dan Cepat</p>
                <div class="hero-buttons">
                    <a href="login.html" class="btn-primary">Login</a>
                    <a href="register.html" class="btn-secondary">Register</a>
                </div>
            </div>
        </div>

        <div class="featured-products">
            <h2>Produk Unggulan</h2>
            <div class="products-grid" id="featuredProducts"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Splash screen handler
        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                
                // Check if user is logged in
                const user = localStorage.getItem('ruxx_user');
                if (user) {
                    const userData = JSON.parse(user);
                    document.getElementById('userDisplay').innerHTML = `
                        <span>👤 ${userData.username}</span>
                        <button onclick="logout()" class="logout-btn">Logout</button>
                    `;
                } else {
                    document.getElementById('userDisplay').innerHTML = `<a href="login.html" class="btn-small">Login</a>`;
                }
                
                loadFeaturedProducts();
            }, 500);
        }, 2000);
        
        function logout() {
            localStorage.removeItem('ruxx_user');
            window.location.href = 'index.html';
        }
        
        async function loadFeaturedProducts() {
            try {
                const response = await fetch('https://your-backend-url/api/products');
                const products = await response.json();
                const featured = products.slice(0, 4);
                
                const grid = document.getElementById('featuredProducts');
                grid.innerHTML = featured.map(p => `
                    <div class="product-card" onclick="viewProduct(${p.id})">
                        <div class="product-image" style="background-image: url('${p.image}')"></div>
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <p class="price">Rp${p.price.toLocaleString()}</p>
                            <span class="badge ${p.is_instant ? 'instant' : 'manual'}">${p.is_instant ? 'Instant' : 'Manual'}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }
        
        function viewProduct(id) {
            window.location.href = `product.html?id=${id}`;
        }
    </script>
</body>
</html>
